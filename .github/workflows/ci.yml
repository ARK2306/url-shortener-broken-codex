name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install CI tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq protobuf-compiler
          protoc --version

      - name: Check API and worker sources
        run: |
          npm ci --prefix api
          npm test --prefix api
          python3 -m py_compile worker/worker.py

      - name: Build and start services
        run: docker compose up --detach --build --wait --wait-timeout 180

      - name: Run integration tests
        run: ./scripts/integration-test.sh

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
        run: |
          image_repository="${IMAGE_REPOSITORY,,}"
          docker tag url-shortener-api:local "ghcr.io/${image_repository}/api:${GITHUB_SHA}"
          docker tag url-shortener-api:local "ghcr.io/${image_repository}/api:latest"
          docker tag url-shortener-worker:local "ghcr.io/${image_repository}/worker:${GITHUB_SHA}"
          docker tag url-shortener-worker:local "ghcr.io/${image_repository}/worker:latest"
          docker push "ghcr.io/${image_repository}/api:${GITHUB_SHA}"
          docker push "ghcr.io/${image_repository}/api:latest"
          docker push "ghcr.io/${image_repository}/worker:${GITHUB_SHA}"
          docker push "ghcr.io/${image_repository}/worker:latest"
